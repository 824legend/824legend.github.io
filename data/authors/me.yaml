research:


  - title: 企业人工智能水平对非效率投资的影响——基于财务决策的视角
    role: 第二作者
    date: 2025
    summary: |
      张戡教授研究项目。
      基于中国A股上市公司数据，研究企业人工智能水平
      对非效率投资的影响机制。
      
      主要负责机制检验和异质性分析，
      论文发表于《财务管理研究》。


  - title: 多因子量化投资策略研究
    role: 项目负责人
    date: 2025
    summary: |
      基于沪深300成分股构建多因子量化投资策略。
      
      通过ICIR指标从六大类别26个候选因子中筛选
      市盈率、换手率、账面市值比等9个有效因子，
      策略回测期获得14.90%的年化超额收益。


