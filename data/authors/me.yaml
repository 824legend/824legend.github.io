experience:
  - role: 金融工程暑期实习生
    org: 深圳证券交易所 会员管理部
    start: 2026-07-01
    end: 2026-09-30
    summary: |
      围绕深市ST股票涨跌幅限制改革开展制度效果评估，基于改革前后股票交易数据构建指标体系，分析涨跌停约束、流动性及波动变化；发现改革后收盘涨停比例由33.49%下降至2.63%，连续涨跌停显著减少，验证交易机制优化效果。
      开展最低订单停留时间制度国际研究，系统梳理欧美及亚洲主要市场监管实践，对NASDAQ M-ELO、TSX Long Life Order等订单机制进行比较分析，研究高频交易监管与市场微观结构优化路径。
      开展SEC订单生命周期研究。
  - role: 量化研究实习生
    org: 星云至恒（厦门）私募基金管理有限公司
    start: 2025-10-01
    end: 2026-05-31
    summary: |
      订单流交易研究与策略开发：系统梳理国内外订单流交易研报与学术文献，提炼市场微观结构核心逻辑；基于DolphinDB高频数据复现并优化订单流策略，完成回测验证与稳健性分析。
      高频数据建模与因子挖掘：运用DolphinDB处理多维度高频数据（逐笔交易、盘口数据等），开发并测试订单流不平衡等多个潜在套利因子，参与构建订单流驱动的套利模型。
      多资产配置策略研究：基于券商资产池构建多资产配置框架，复现多种风险平价改进模型并开展回测；PCA风险平价策略表现最优，年化收益6.29%、最大回撤1.15%、Sharpe 2.62、Calmar 5.45。
      可转债多因子策略研究：构建可转债量化选券框架，融合估值、量价及正股特征因子，完成因子预处理、分层回测与策略对比，形成研究报告并提出优化建议。
  - role: 采购实习生
    org: 施耐德电气（厦门）开关设备有限公司
    start: 2025-07-01
    end: 2025-09-30
    summary: |
      负责采购全流程数据管理与分析：独立执行从询价、报价跟踪到新物料价格维护的全流程数据工作，制作月度调价报表、处理分析采购数据，为成本控制提供支持。
      主导跨部门沟通与协同：独立对接供应商及公司内部部门进行高效协调，熟练操作供应商管理平台与OA系统，保障采购流程的顺畅与标准化。
  - role: 财务实习生
    org: 成都萌想科技有限责任公司（实习僧）
    start: 2023-10-01
    end: 2024-01-31
    summary: |
      经营分析：协助完成月度经营分析报告编制，主要负责财务数据整合，精准定位关键财务指标波动因素。
      全面预算管理：参与2024年度预算编制全流程，整理2023年历史费用数据并编制各部门预算收集表。
      专项财务管理：参与费用审批SOP流程和费用报销流程；协调部门完成政府补助申报材料汇编，助力公司成功获取成都市高新区"科技型中小企业发展专项资金"100万元。

