experience:
  - role: 金融工程暑期实习生
    org: 深圳证券交易所 · 会员管理部
    start: 2026-07-01
    end: 2026-09-30
    summary: |
      - **ST 股票涨跌幅限制改革效果评估**：基于改革前后股票交易数据构建多维度评价指标体系，实证检验涨跌停约束、市场流动性及波动性变化，量化验证交易机制优化成效，为改革政策评估提供数据支撑。
      - **最低订单停留时间（MRT）国际研究**：系统梳理欧美及亚洲主要市场监管实践，对 NASDAQ M-ELO、TSX Long Life Order 等订单机制进行比较分析，研究高频交易监管与市场微观结构优化路径。
      - **境内外收盘机制研究**：梳理德国 Xetra、新加坡交易所、韩国交易所等市场收盘集合竞价制度，从竞价阶段划分、订单类型、价格形成机制、信息披露四个维度构建比较框架，输出国际经验研究报告，支撑深市收盘交易机制优化方案。
      - **订单成交比（OTR）监管机制研究**：梳理 MiFID II 框架下算法交易监管要求及欧美、亚洲主要交易所 OTR 管理实践，比较差异化收费、超额订单费用及监管约束等模式，分析高频交易订单流管理与市场微观结构优化路径。
      - **融资融券交易行为与市场风险**：基于融资融券余额、担保物市值及单一股票担保比例等指标构建监测框架，实证分析高杠杆股票在市场下跌期的同涨同跌现象，量化评估杠杆资金集中度对价格波动与市场风险传导的影响。

  - role: 量化研究实习生
    org: 星云至恒（厦门）私募基金管理有限公司
    start: 2025-10-01
    end: 2026-05-31
    summary: |
      - **订单流交易研究与策略开发**：系统梳理国内外订单流交易研报与学术文献，提炼市场微观结构核心逻辑；基于 DolphinDB 高频数据复现并优化订单流策略，完成回测验证与稳健性分析。
      - **高频数据建模与因子挖掘**：运用 DolphinDB 处理逐笔交易、盘口数据等多维度高频数据，开发并测试订单流不平衡等多个潜在套利因子，参与构建订单流驱动的套利模型，为策略组合提供实证支持。
      - **多资产配置策略研究（风险平价改进）**：基于券商资产池构建多资产配置框架，复现多种风险平价改进模型并开展回测；其中 PCA 风险平价策略表现最优，年化收益 6.29%、最大回撤 1.15%、Sharpe 2.62、Calmar 5.45，并建立滚动跟踪机制。
      - **可转债多因子策略研究**：构建可转债量化选券框架，融合估值、量价及正股特征因子，完成因子预处理、分层回测与策略对比，形成研究报告并提出优化建议。
      - **策略文档与团队协作**：撰写策略复现报告与数据分析文档，清晰呈现研究假设、回测结果与改进方向，助力团队策略评审与决策。

  - role: 量化金融组部长（此前任核心成员）
    org: 厦门大学经济学科 WiserClub
    start: 2024-09-01
    end: 2026-09-30
    summary: |
      - 2024.09–2025.09 任核心成员，2025.09–2026.09 任**部长**，组织团队每周开展量化金融前沿知识研讨与项目复盘。
      - 构建沪深 300 成分股多因子量化投资策略，基于 ICIR 指标从六大类 26 个因子中筛选 9 个核心因子，回测取得 **14.90% 年化超额收益率**。
      - 参与经济学院院长周颖刚教授智能投顾项目，参与研发全球资产配置交易系统，负责系统功能迭代与差异化功能挖掘。

  - role: 采购实习生
    org: 施耐德电气（厦门）开关设备有限公司
