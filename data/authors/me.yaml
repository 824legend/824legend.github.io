bio: |
  曾磊，厦门大学经济学院金融专业硕士研究生。
  研究方向主要包括量化投资、金融市场微观结构、资产定价、
  固定收益证券与机器学习在金融领域的应用。
  
  具备量化策略开发、高频金融数据分析、多因子投资组合构建、
  多资产配置模型研究等经验，致力于运用数据分析与计量方法
  探索金融市场中的投资机会。

