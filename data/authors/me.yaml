    summary: |
      - **采购全流程数据管理与分析**：独立执行从询价、报价跟踪到新物料价格维护的全流程数据工作，制作月度调价报表、处理分析采购数据，为成本控制提供支持。
      - **跨部门沟通与协同**：独立对接供应商及公司内部部门进行高效协调，熟练操作供应商管理平台与 OA 系统，保障采购流程的顺畅与标准化。

  - role: 财务实习生
    org: 成都萌想科技有限责任公司（实习僧）
    start: 2023-10-01
